schema_version: 1

context:
  version: "0.1.6"

package:
  name: citeproc-py-styles
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/citeproc-py-styles/citeproc_py_styles-${{ version }}.tar.gz
  sha256: 6499914e1425f2d7275f15d8c8417982314b5b79c1b63a9669719fdaeb833169

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - pytest-runner >=2.6.2
    - python ${{ python_min }}.*
    - setuptools
  run:
    - lxml >=4.1.1
    - python >=${{ python_min }}
    - six >=1.10.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - citeproc_styles
      pip_check: true

about:
  summary: CSL styles.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/inveniosoftware/citeproc-py-styles

extra:
  recipe-maintainers:
    - mikemhenry
